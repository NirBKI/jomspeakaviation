name: Security Audit Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  security-scans:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history required for secret detection

      - name: Gate 1 - Secret Scanning (TruffleHog)
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified

      - name: Gate 2 - SAST (Semgrep)
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/security-audit
            p/owasp-top-ten
          auditOnInvalidConfig: true

      - name: Gate 3 - Dependency Audit (npm)
        run: npm audit --audit-level=high
        continue-on-error: true # Prevents failure if package-lock is missing initially
